<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f2dcc0" />
    <!-- iOS: run as a standalone app (no Safari chrome) when added to the
         home screen, and match the light "ledger" shell so the status bar
         blends in. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiftLog" />
    <title>LiftLog</title>
    <script>
      (function () {
        var base = '/liftlog/'
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              if (reg.scope.indexOf(base) === -1) {
                reg.unregister()
              }
            })
          })
        }
        if (location.pathname !== base && location.pathname.indexOf(base) !== 0) {
          location.replace(base + location.search + location.hash)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
